name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]

jobs:
  server:
    name: Server — Lint & Build
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: nebula_user
          POSTGRES_PASSWORD: nebula_pass
          POSTGRES_DB: nebula_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate
        working-directory: server

      - name: Lint server
        run: npm run lint
        working-directory: server
        continue-on-error: true

      - name: Build server
        run: npm run build
        working-directory: server
        env:
          DATABASE_URL: postgresql://nebula_user:nebula_pass@localhost:5432/nebula_test
          REDIS_URL: redis://localhost:6379
          JWT_ACCESS_SECRET: test-access-secret-for-ci-only-not-used-in-production
          JWT_REFRESH_SECRET: test-refresh-secret-for-ci-only-not-used-in-production

  client:
    name: Client — Lint & Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build client
        run: npm run build
        working-directory: client
        env:
          VITE_API_URL: http://localhost:3001/api/v1
          VITE_WS_URL: ws://localhost:3001
